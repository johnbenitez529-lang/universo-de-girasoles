<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo de Girasoles 🌻</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #080611;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .contenedor {
      padding: 30px;
    }

    .girasol {
      font-size: 90px;
      animation: flotar 3s ease-in-out infinite;
    }

    h1 {
      font-size: 35px;
      margin: 20px 0 10px;
    }

    p {
      font-size: 18px;
      color: #f5d76e;
    }

    @keyframes flotar {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <div class="girasol">🌻</div>

    <h1>Bienvenida a tu universo</h1>

    <p>
      Hay personas que llegan a tu vida<br>
      y sin darse cuenta hacen que todo florezca.
    </p>
  </div>

</body>
</html>
